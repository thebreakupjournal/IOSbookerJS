name: Deploy Guide to GitHub Pages

on:
  push:
    branches:
      - agent/bc-parks-bookmarklet
      - main
      - master
    paths:
      - guide/**
      - .github/workflows/guide-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guide-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload guide artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./guide

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
